<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Asia Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --bg: #171717;
        --surface-deep: #0a0a0a;
        --border: #262626;
        --text-primary: #fafafa;
        --text-muted: #a3a3a3;
        --blue: #93c5fd;
        --blue-border: rgba(59, 130, 246, 0.35);
      }

      * {
        box-sizing: border-box;
      }

      *::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      *::-webkit-scrollbar-track {
        background: transparent;
      }
      *::-webkit-scrollbar-thumb {
        background-color: rgba(255, 255, 255, 0.15);
        border-radius: 10px;
        border: 2px solid transparent;
        background-clip: content-box;
      }
      *::-webkit-scrollbar-thumb:hover {
        background-color: #8b5cf6;
      }

      body {
        margin: 0;
        min-height: 100vh;
        overflow-x: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 24px;
        background-color: var(--bg);
        background-image: radial-gradient(
          circle at 20% 20%,
          rgba(59, 130, 246, 0.06),
          transparent 45%
        );
        color: var(--text-primary);
        font-family: "Open Sans", sans-serif;
      }

      #particles-canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 1;
      }

      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes lineSweep {
        0%, 100% {
          opacity: 0.4;
          transform: translateX(-8%);
        }
        50% {
          opacity: 0.85;
          transform: translateX(8%);
        }
      }

      @keyframes subtleFloat {
        0%, 100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-4px);
        }
      }

      .main-card {
        position: relative;
        z-index: 10;
        display: flex;
        align-items: center;
        gap: 48px;
        padding: 40px;
        max-width: 880px;
        width: 100%;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: 0 24px 48px -12px rgba(0, 0, 0, 0.7);
        overflow: hidden;
        animation: fadeUp 0.65s cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      .main-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 12%;
        right: 12%;
        height: 1px;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(59, 130, 246, 0.55),
          rgba(139, 92, 246, 0.55),
          transparent
        );
        pointer-events: none;
        animation: lineSweep 8s cubic-bezier(0.45, 0, 0.55, 1) infinite;
      }

      .image-frame {
        flex-shrink: 0;
        width: 280px;
        height: 350px;
        border-radius: 12px;
        background: var(--surface-deep);
        border: 1px solid var(--border);
        overflow: hidden;
        animation: fadeUp 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.05s both,
          subtleFloat 7s ease-in-out 0.8s infinite;
        transition: border-color 0.35s cubic-bezier(0.22, 1, 0.36, 1);
      }

      .image-frame:hover {
        border-color: var(--blue-border);
      }

      .hero-image {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        will-change: transform;
        transition-property: transform;
        transition-duration: 700ms;
        transition-timing-function: cubic-bezier(0.22, 1, 0.36, 1);
      }

      .image-frame:hover .hero-image {
        transform: scale(1.05);
      }

      .text-content {
        flex: 1;
        min-width: 0;
      }

      .main-title {
        font-size: 3.1rem;
        line-height: 1.08;
        margin: 0;
        font-weight: 700;
        letter-spacing: -0.025em;
        color: var(--text-primary);
        animation: fadeUp 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.12s both;
      }

      .main-title .accent {
        background: linear-gradient(90deg, #fafafa 25%, #93c5fd 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .description {
        font-size: 0.96rem;
        line-height: 1.7;
        color: var(--text-muted);
        margin: 18px 0 0;
        max-width: 440px;
        animation: fadeUp 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.2s both;
      }

      .cta-link {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-top: 26px;
        padding: 11px 20px;
        background: var(--surface-deep);
        border: 1px solid var(--border);
        border-radius: 10px;
        color: var(--text-primary);
        font-size: 0.9rem;
        font-weight: 600;
        text-decoration: none;
        animation: fadeUp 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.28s both;
        transition: border-color 0.35s cubic-bezier(0.22, 1, 0.36, 1),
          color 0.35s cubic-bezier(0.22, 1, 0.36, 1),
          transform 0.35s cubic-bezier(0.22, 1, 0.36, 1),
          box-shadow 0.35s cubic-bezier(0.22, 1, 0.36, 1);
      }

      .cta-link:hover {
        border-color: var(--blue-border);
        color: var(--blue);
        transform: translateY(-2px);
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.5);
      }

      .cta-arrow {
        transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
      }

      .cta-link:hover .cta-arrow {
        transform: translateX(3px);
      }

      @media (max-width: 768px) {
        .main-card {
          flex-direction: column;
          text-align: center;
          padding: 32px 24px;
          gap: 28px;
        }
        .description {
          margin-left: auto;
          margin-right: auto;
        }
        .main-title {
          font-size: 2.35rem;
        }
        .image-frame {
          width: 220px;
          height: 275px;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="particles-canvas"></canvas>

    <main class="main-card">
      <div class="image-frame">
        <img
          src="{{ url_for('static', filename='images/asia.webp') }}"
          alt="Asia"
          class="hero-image"
        />
      </div>

      <div class="text-content">
        <h1 class="main-title">
          Asia<br /><span class="accent">Assistant</span>
        </h1>
        <p class="description">
          Backend AI engine for Iko's portfolio. Answers questions about his profile, skills, experience, and projects in real time.
        </p>
        <a
          href="https://www.ikonyek.my.id/"
          target="_blank"
          rel="noopener noreferrer"
          class="cta-link"
        >
          <span>View Portfolio</span>
          <span class="cta-arrow">&rarr;</span>
        </a>
      </div>
    </main>

    <script>
      (() => {
        const canvas = document.getElementById("particles-canvas");
        const ctx = canvas.getContext("2d");
        let w = (canvas.width = window.innerWidth);
        let h = (canvas.height = window.innerHeight);

        const particles = Array.from({ length: 40 }, () => ({
          x: Math.random() * w,
          y: Math.random() * h,
          r: Math.random() * 1.6 + 0.8,
          vx: (Math.random() - 0.5) * 0.25,
          vy: -(Math.random() * 0.35 + 0.15),
          alpha: Math.random() * 0.45 + 0.2,
        }));

        window.addEventListener("resize", () => {
          w = canvas.width = window.innerWidth;
          h = canvas.height = window.innerHeight;
        });

        function draw() {
          ctx.clearRect(0, 0, w, h);
          for (const p of particles) {
            p.x += p.vx;
            p.y += p.vy;
            if (p.y < -10) { p.y = h + 10; p.x = Math.random() * w; }
            if (p.x < -10) p.x = w + 10;
            if (p.x > w + 10) p.x = -10;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(255, 255, 255, ${p.alpha})`;
            ctx.fill();
          }
          requestAnimationFrame(draw);
        }
        draw();
      })();
    </script>
  </body>
</html>
